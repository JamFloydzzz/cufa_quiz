const questions=[["Тебе дали компанию и неделю на изучение. С чего начнёшь?", [["ma", "Кто мог бы купить этот бизнес и сколько он стоит?"], ["re", "Что в этой компании рынок мог упустить?"], ["am", "Как её акции изменили бы риск моего портфеля?"], ["vc", "Может ли из этой маленькой команды вырасти лидер рынка?"]]], ["Сеть кофеен хочет открыть ещё десять точек. За что возьмёшься?", [["fp", "Прикину по месяцам, когда закончатся деньги на открытие."], ["st", "Сравню три города и выберу, куда заходить первым."], ["dc", "Посчитаю, какой долг кофейни потянут даже в тихий сезон."], ["pe", "Представлю, что мы купили сеть. Что улучшим в первых пяти точках?"]]], ["У тебя есть полчаса до встречи. Что откроешь первым?", [["ec", "Список вопросов инвесторов, которым предлагают новые акции."], ["tr", "Экран с ценами и заявками покупателей и продавцов."], ["qu", "Таблицу с историей цен. Хочу проверить одну догадку."], ["re", "Свежий отчёт компании. Интересно, где мой прогноз разошёлся с фактом."]]], ["Что приятнее услышать от команды в пятницу вечером?", [["ma", "«Обе стороны согласовали цену. Покупку можно закрывать»."], ["vc", "«Мы нашли первых клиентов стартапа. Давай узнаем, почему они вернулись»."], ["fp", "«Теперь понятно, куда уходит прибыль и почему на счёте пусто»."], ["ec", "«Покупателей хватило на весь выпуск акций по согласованной цене»."]]], ["У производителя мебели появился свободный цех. Какая задача твоя?", [["st", "Решить, запускать ли там кухни или сдавать помещение."], ["pe", "После покупки фабрики помочь директору сократить простой станков."], ["dc", "Разобраться, хватит ли выручки на выплаты по облигациям, если цех пустует."], ["am", "Пересмотреть долю фабрики в портфеле с учётом нового риска."]]], ["На рынке шум из-за одной новости. Какой вопрос интереснее?", [["tr", "По какой цене прямо сейчас получится исполнить заявку клиента?"], ["qu", "Как часто похожие новости вообще влияли на цену?"], ["re", "Как новость меняет мой прогноз прибыли компании?"], ["ec", "Стоит ли компании перенести намеченную продажу новых акций?"]]], ["Из четырёх встреч можно попасть только на одну. К кому пойдёшь?", [["vc", "К основателям приложения, у которого пока сто пользователей."], ["ma", "К владельцам двух компаний, которые обсуждают объединение."], ["dc", "К компании, которая решает, на сколько лет занять деньги."], ["st", "К руководителям, которые выбирают между двумя рынками."]]], ["На экране четыре таблицы. Какую захочется покрутить?", [["qu", "Тысячи наблюдений. Интересно, повторится ли эффект на новых данных."], ["fp", "Бюджет отделов. Хочу понять, почему доставка внезапно подорожала."], ["am", "Состав фонда. Кажется, слишком многое зависит от одной отрасли."], ["pe", "Показатели трёх купленных заводов. Почему один работает лучше?"]]], ["С чем ты скорее готов мириться?", [["ec", "Переписывать рассказ о бизнесе после десятка встреч с будущими акционерами."], ["tr", "Быстро менять решение, потому что прежней цены уже нет."], ["ma", "В третий раз пересчитать сделку после смены условий покупателем."], ["vc", "Встретиться с двадцатью командами и никому не предложить деньги."]]], ["Ты в команде студенческого фестиваля. Что заберёшь себе?", [["fp", "Следить за расходами и обновлять прогноз до самого фестиваля."], ["st", "Решить, стоит ли в следующем году выходить в другой город."], ["qu", "Проверить на старых данных, помогает ли ранняя рассылка продавать билеты."], ["dc", "Продумать, из каких поступлений вовремя вернуть заём на площадку."]]], ["Какой спор за обедом точно затянется?", [["am", "Сколько денег фонда можно вложить в одну очень хорошую идею?"], ["re", "Почему все ждут слабого квартала, хотя магазины полны людей?"], ["ec", "Какую долю компании основатели готовы отдать новым акционерам?"], ["pe", "Какое изменение сильнее всего поднимет стоимость купленного бизнеса?"]]], ["На стажировке предлагают провести день с коллегой. С кем?", [["tr", "С трейдером, который делит большую заявку на части и следит за ценой."], ["ma", "С консультантом, который сравнивает предложения двух покупателей."], ["vc", "С инвестором, который проверяет продукт вместе с его пользователями."], ["st", "С командой развития, которая тестирует новый формат магазина."]]], ["План пошёл не по плану. Где захочешь докопаться до причины?", [["dc", "Заёмщик может пропустить выплату. Какие деньги успеют прийти?"], ["qu", "Модель хорошо работает только на данных, на которых её придумали."], ["fp", "Продажи по плану, а расходы на каждую доставку выросли."], ["re", "Прибыль выше прогноза. Это разовый доход или бизнес изменился?"]]], ["Кому ты охотнее объяснишь свои расчёты?", [["ec", "Основателю перед первой встречей с покупателями акций его компании."], ["am", "Комитету фонда, который решает, какую позицию сократить."], ["pe", "Директору купленной сети, с которым предстоит менять закупки."], ["tr", "Коллеге за соседним экраном, который прямо сейчас исполняет сделку."]]], ["Тебе показывают новый сервис для малого бизнеса. Что спросишь?", [["vc", "Кто из первых клиентов уже платит и почему?"], ["st", "Как сервис впишется в продукты нашей компании?"], ["ma", "Что получит покупатель, если приобретёт весь сервис?"], ["qu", "На каких данных проверяли прогноз ухода клиентов?"]]], ["У компании впереди большой платёж. Чем займёшься?", [["dc", "Сравню два варианта нового займа для погашения старого."], ["fp", "Соберу календарь поступлений и расходов на ближайшие недели."], ["re", "Разберу, как этот платёж повлияет на мой прогноз для читателей обзора."], ["am", "Решу, стоит ли фонду сократить вложения в эту компанию."]]], ["В каком ритме приятнее увидеть результат?", [["tr", "Сразу увидеть цену, по которой прошла моя заявка."], ["pe", "Несколько кварталов следить, как меняется бизнес после нашей покупки."], ["ec", "Провести компанию от первых встреч с инвесторами до выпуска акций."], ["st", "Сначала испытать идею в одном городе, потом решить, расширять ли запуск."]]], ["В презентации нашлось место на один график. Что покажешь?", [["ma", "Диапазон цен, по которым покупали похожие компании."], ["vc", "Как часто первые пользователи возвращаются в продукт."], ["qu", "Как ведёт себя найденная закономерность на другом периоде."], ["dc", "В какие годы компании предстоят самые крупные выплаты долга."]]], ["Чей рабочий чат тебе интереснее читать?", [["fp", "Руководителей отделов, которые объясняют отклонения от бюджета."], ["ec", "Команды размещения, которая собирает заявки на новые акции."], ["tr", "Торговой команды, которая обсуждает, где сейчас есть покупатель."], ["re", "Аналитиков, которые сверяют свои прогнозы с новыми данными отрасли."]]], ["Компания готова к переменам. Какое решение оставишь за собой?", [["pe", "Что поменять в первые сто дней после покупки контрольной доли."], ["st", "Куда направить команду развития в следующие три года."], ["am", "Как распределить деньги фонда между этой компанией и её конкурентами."], ["ma", "На каких условиях предложить владельцу продать бизнес."]]], ["Основатель говорит: «Нам нужны деньги на рост». Что уточнишь?", [["vc", "Что уже получилось доказать с очень маленькой командой?"], ["dc", "Из чего будете платить проценты, пока новый проект набирает обороты?"], ["ec", "Какую часть бизнеса готовы предложить инвесторам за эти деньги?"], ["fp", "Сколько денег и в каком месяце на самом деле потребуется?"]]], ["Какой результат недели хочется показать другу?", [["qu", "«Проверил красивую идею. Работала, пока я не учёл комиссии»."], ["tr", "«Удалось купить весь нужный объём, пока цена не ушла»."], ["re", "«Разобрал отчёт так, что теперь могу объяснить компанию за две минуты»."], ["st", "«Нашёл дешёвый способ проверить, нужен ли нам новый рынок»."]]], ["Есть два похожих производителя. Что хочется с ними сделать?", [["ma", "Посчитать, сколько удастся сэкономить, если их объединить."], ["pe", "Выбрать одного для покупки и наметить, как улучшить производство."], ["am", "Подобрать доли обоих в портфеле с учётом других вложений."], ["ec", "Помочь одному убедить инвесторов подписаться на его выпуск акций."]]], ["Какую неопределённость тебе любопытнее распутывать?", [["vc", "Полюбят ли продукт люди, которые о нём пока не слышали?"], ["qu", "Нашёл ли я повторяемый эффект или мне повезло с выборкой?"], ["dc", "Сможет ли компания вернуть долг, если продажи просядут?"], ["tr", "Хватит ли встречных заявок, чтобы продать сейчас по этой цене?"]]], ["На собеседовании дают папку с цифрами. Какое задание хочется получить?", [["fp", "Объяснить директору, почему при росте выручки стало меньше денег."], ["re", "Написать короткий обзор и назвать факт, который изменил бы мой прогноз."], ["st", "Выбрать между запуском своего продукта и партнёрством с другой командой."], ["pe", "Найти узкое место в бизнесе, в который фонд уже вложился."]]], ["Что приятнее довести до финала?", [["ma", "Договориться о цене покупки с владельцем бизнеса."], ["ec", "Подобрать цену новых акций, при которой компания соберёт нужную сумму."], ["dc", "Согласовать срок выпуска облигаций и посильный график выплат."], ["am", "Решить, от какой идеи отказаться, чтобы освободить место в портфеле."]]], ["Какой вопрос задашь в гостях у финансовой команды?", [["tr", "Что вы делаете, когда цена меняется прямо во время исполнения?"], ["vc", "Как вы отличили перспективную команду ещё до первых больших продаж?"], ["qu", "Как вы проверяете, не подсмотрела ли модель ответ в будущих данных?"], ["fp", "Как руководители используют ваш прогноз, когда денег на всё не хватает?"]]], ["У тебя полдня на записку руководителю. Какую тему возьмёшь?", [["re", "За счёт чего компания может заработать больше, чем от неё ждут."], ["am", "Как защитить портфель, если сразу несколько идей окажутся ошибочными."], ["pe", "Какие изменения на купленной фабрике уже дали прибавку к прибыли."], ["st", "Как понять по итогам пробного запуска, пора ли масштабировать проект."]]], ["Что бы ты сделал с учебным миллионом?", [["pe", "Выбрал долю в зрелом бизнесе и составил с директором план улучшений."], ["vc", "Нашёл молодую команду и проверил, на какой эксперимент ей хватит денег."], ["tr", "Потренировался исполнять заявки в биржевом симуляторе."], ["dc", "Сравнил два выпуска облигаций и оценил, кто надёжнее вернёт долг."]]], ["Какую задачу ты бы взял ещё раз, даже если первый раз вышло средне?", [["ma", "Защитить оценку бизнеса перед покупателем, который хочет скидку."], ["fp", "Пересобрать прогноз расходов вместе с теми, кто отвечает за них в компании."], ["qu", "Проверить гипотезу заново, когда в первом расчёте нашлась ошибка."], ["am", "Пересмотреть состав портфеля и обосновать каждое изменение."]]]], profiles={"ma": ["M&A", "Слияния и поглощения", "Ты смотришь на компанию глазами покупателя. В M&A-команде банка или бутика ты будешь оценивать бизнес, сравнивать предложения и помогать сторонам договориться об условиях покупки.", "Выбери две знакомые сети. На одной странице объясни, зачем одной покупать другую, за счёт чего покупка окупится и что может сорвать сделку."], "re": ["Equity Research", "Аналитика публичных компаний", "Тебе интересно составить своё мнение о бизнесе и защитить его цифрами. В аналитической команде банка или брокера из этого получаются прогнозы, обзоры и вопросы руководству компаний.", "Открой годовой отчёт знакомой компании. Найди главный источник роста выручки и запиши, какую цифру проверишь через квартал, чтобы подтвердить свою версию."], "am": ["Asset Management", "Управление инвестициями", "Тебе близки решения на уровне портфеля. В управляющей компании даже хорошая идея конкурирует за место с другими, а размер вложения определяет, чем рискует весь фонд.", "Распредели условные 100 рублей между тремя знакомыми бизнесами. Представь спад спроса у их общего клиента и объясни, какую долю ты пересмотришь первой."], "vc": ["Venture Capital", "Венчурные инвестиции", "Тебе интересно замечать потенциал, когда истории продаж ещё почти нет. В венчурном фонде ты будешь знакомиться с основателями и проверять, кому действительно нужен их продукт.", "Выбери молодой сервис. Поговори с двумя его пользователями о последнем реальном использовании. Запиши один довод вложиться и один вопрос, который остался к основателям."], "pe": ["Private Equity", "Прямые инвестиции", "Тебе интересно, что можно изменить в зрелой компании после покупки. В фонде прямых инвестиций ты оцениваешь бизнес, а затем вместе с руководством ищешь способы поднять его стоимость.", "Возьми сеть кафе. Выбери одно улучшение для первых ста дней после покупки и прикинь, как изменится прибыль одной точки. Укажи, какие данные запросишь у директора."], "qu": ["Quant", "Количественные финансы", "Тебе нравится проверять, переживёт ли красивая идея встречу с данными. В количественной команде фонда или банка ты будешь строить модели и искать ошибки в собственных выводах.", "Возьми ряд дневных цен. Проверь в таблице догадку «после двух дней падения чаще бывает рост». Сравни с обычной частотой роста, затем повтори на другом периоде."], "tr": ["Trading", "Трейдинг", "Тебе близки решения, результат которых виден быстро. На торговом столе банка или брокера важны цена исполнения, доступный объём и размер риска, пока заявка в работе.", "В учебном биржевом стакане попробуй купить больше бумаг, чем предлагают по лучшей цене. Посчитай среднюю цену и сравни с вариантом, в котором часть заявки ждёт."], "fp": ["FP&A", "Финансовое планирование и анализ", "Тебе интересно, как решения внутри компании отражаются на деньгах. В финансовом департаменте ты будешь собирать бюджет, обновлять прогноз и объяснять отклонения вместе с бизнесом.", "Собери бюджет студенческого мероприятия на месяц. Пусть часть гостей заплатит позже. Покажи организатору, в какой день возникнет нехватка денег и что можно перенести."], "ec": ["ECM", "Рынки акционерного капитала", "Тебе интересно помогать компаниям привлекать деньги через выпуск акций. В ECM-команде банка связывают цели владельцев, оценку бизнеса и спрос инвесторов на размещение.", "У основателя 80 акций из 100. Компания выпускает ещё 25. Посчитай новую долю основателя и напиши три вопроса, которые задал бы покупатель новых акций."], "dc": ["DCM", "Рынки долгового капитала", "Тебе интересно, как привлечь деньги в долг и вернуть их в срок. В DCM-команде банка ты помогаешь компаниям выбирать условия выпуска облигаций и обсуждать их с инвесторами.", "У компании сезонная выручка. Нарисуй два графика погашения одного займа — равными частями и в конце срока. Отметь, какой месяц самый трудный для каждого варианта."], "st": ["Strategic Development", "Стратегическое развитие", "Тебе интересно выбирать, куда компании расти и как проверить эту идею. В команде стратегии ты сравниваешь рынки и способы выхода на них, защищаешь выбор и следишь за результатами пилота.", "Выбери знакомый сервис и два города для запуска. Сравни спрос, конкурентов и стоимость старта. Предложи один город и назови результат месячного пилота, при котором продолжишь."]};

function question(){const [prompt,opts]=questions[step];show(`<section class="quiz"><div class="row"><span class="eyebrow">Карьерный квиз</span><span class="count">Вопрос ${step+1} из 30</span></div><div class="bar"><i style="width:${100*(step+1)/30}%"></i></div><h2 id="prompt">${prompt}</h2><p class="hint">Выбери один вариант, который тебе ближе.</p><div class="opts" role="group" aria-labelledby="prompt">${opts.map(([id,label],i)=>`<button class="opt" aria-pressed="${answers[step]===i}" onclick="choose(${i})"><span>${letters[i]}</span>${label}</button>`).join('')}</div><div class="row nav"><button class="link" onclick="back()">← Назад</button><button id="next" class="btn" onclick="advance()" ${answers[step]===null?'disabled':''}>${step===29?'Мой результат':'Дальше'}</button></div><button class="link early" id="finish" onclick="results()" ${answers.every(x=>x===null)?'disabled':''}>Завершить досрочно</button></section>`)}
function choose(i){answers[step]=i;app.querySelectorAll('.opt').forEach((b,n)=>b.setAttribute('aria-pressed',n===i));document.querySelector('#next').disabled=false;document.querySelector('#finish').disabled=false}
function back(){if(step===0)return home();step--;question()}
function advance(){if(answers[step]===null)return;if(step===29)return results();step++;question()}
function ranked(){const scores=Object.fromEntries(Object.keys(profiles).map(id=>[id,{id,total:0,hits:[]}]));questions.forEach(([,opts],n)=>{if(answers[n]===null)return;opts.forEach(([id])=>scores[id].total++);const [id,label]=opts[answers[n]];scores[id].hits.push([n+1,label])});return Object.values(scores).map(s=>({...s,score:s.total?s.hits.length/s.total:0})).sort((a,b)=>b.score-a.score)}
function card(s){const [name,ru,desc,task]=profiles[s.id];return `<article class="card"><div class="eyebrow">${ru}</div><h3>${name}</h3><p>${desc}</p><details><summary>Твои ответы · ${s.hits.length} из ${s.total} возможных</summary><ul>${s.hits.map(([n,t])=>`<li>№ ${n}. ${t}</li>`).join('')}</ul></details><p class="task"><b>Попробуй на практике</b>${task}</p></article>`}
function results(){const count=answers.filter(x=>x!==null).length;if(!count)return;const all=ranked(), first=all[0], near=all.filter(s=>s.hits.length && first.score-s.score<=.101), next=all.filter(s=>!near.includes(s)&&s.score>0&&s.score>=all[2].score);show(`<section class="result-head"><div class="eyebrow">${count<30?'Предварительный результат':'Результат квиза'} · ${count} из 30</div><h2>${near.length===1?'Твой первый ориентир':'Тебе близки несколько направлений'}</h2><p>${near.length===1?'Начни с направления, задачи которого ты выбираешь чаще всего.':'По твоим ответам эти направления близки. Сравни пробные задачи и начни с той, за которую хочется взяться первой.'}</p></section>${near.map(card).join('')}${next.length?'<h3 class="group">Ещё стоит присмотреться</h3>'+next.map(card).join(''):''}<details class="directory"><summary>Как получился результат · все направления</summary><p class="note">Мы сравниваем число твоих выборов с числом вопросов, с ответом, где встречалось направление. В первую группу входят результаты в пределах примерно одного ответа от лидера. Это ориентир по интересам.</p><ol>${all.map(s=>`<li>${profiles[s.id][0]} — ${s.total?s.hits.length+' из '+s.total:'пока не встречалось'}</li>`).join('')}</ol></details><div class="actions"><button class="btn" onclick="resetQuiz()">Пройти заново</button><button class="link" onclick="resume()">${count<30?'Продолжить квиз':'Вернуться к ответам'}</button></div>`)}
function resume(){const pending=answers.indexOf(null);if(pending>=0)step=pending;question()}
function resetQuiz(){answers.fill(null);step=0;question()}
home();
